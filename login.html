<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login | FlowChain</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet"
>


<link rel="stylesheet" href="css/login.css">

</head>


<body>


<!-- BACKGROUND NETWORK -->

<div class="tech-network">

    <div class="network-line line-a"></div>

    <div class="network-line line-b green"></div>

    <div class="network-line line-c"></div>

    <div class="signal s1"></div>

    <div class="signal s2 green"></div>

    <div class="signal s3"></div>

</div>


<!-- NAVBAR -->

<header class="navbar-glass">

    <a
        href="index.html"
        class="nav-brand"
    >

        <span class="logo-dot"></span>

        <span>
            FlowChain
        </span>

    </a>


    <nav>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="inventory.html">
                    Operations
                </a>
            </li>

            <li>
                <a href="suppliers.html">
                    Suppliers
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Support
                </a>
            </li>

        </ul>

    </nav>


    <div class="nav-actions">

        <a
            href="login.html"
            class="login active"
        >
            Login
        </a>

        <a
            href="register.html"
            class="access"
        >
            REQUEST ACCESS
        </a>

    </div>

</header>


<!-- LOGIN -->

<main class="login-wrapper">

    <div class="login-card">


        <div class="logo-area">

            <span class="logo-dot"></span>

            <span>
                FlowChain
            </span>

        </div>


        <h2>
            Welcome Back
        </h2>


        <p class="subtitle">
            Enter your authorized enterprise credentials
        </p>


        <div id="error-msg">
            Invalid email address or password. Please try again.
        </div>


        <form
            id="login-form"
            onsubmit="handleLogin(event)"
        >

            <div class="form-group">

                <label for="email-input">
                    Enterprise Email
                </label>

                <input
                    type="email"
                    id="email-input"
                    placeholder="name@flowchain.com"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        aria-label="Show or hide password"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="btn-submit"
            >
                Sign In
            </button>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>


    </div>

</main>


<!-- FOOTER -->

<footer class="site-footer">

    <div class="footer-inner">

        <div class="footer-brand">

            <span class="footer-dot"></span>

            <span>
                FlowChain
            </span>

        </div>


        <div class="footer-copy">
            Industrial Supply Chain Intelligence
        </div>


        <div class="footer-year">
            © 2026 FlowChain
        </div>

    </div>

</footer>


<!-- FLOWCHAIN AUTHENTICATION SYSTEM -->

<script src="js/login.js"></script>


</body>

</html>
