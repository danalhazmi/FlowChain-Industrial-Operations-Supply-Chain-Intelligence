<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowChain | Analytics</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #1d1c1c;
            color: #fffefb;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-top: 115px;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        .nav-brand span,
        .dashboard-title {
            font-family: 'Space Grotesk', sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar-glass {

            position: fixed;

            top: 22px;

            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            max-width: 1250px;

            padding: 14px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: rgba(59, 60, 61, 0.88);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid #b6ccd8;

            border-radius: 100px;

            z-index: 1000;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
        }


        /* =========================
           BRAND
        ========================= */

        .nav-brand {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 18px;

            font-weight: 700;

            color: #fffefb;
        }

        .logo-dot {

            width: 9px;

            height: 9px;

            background: #71c4ef;

            border-radius: 50%;

            box-shadow: 0 0 10px rgba(113, 196, 239, .7);
        }


        /* =========================
           NAV LINKS
        ========================= */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 26px;

            list-style: none;
        }

        .nav-links a {

            color: #c4c4c2;

            font-size: 11px;

            font-weight: 500;

            transition: color .25s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {

            color: #ffffff;
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {

            display: flex;

            align-items: center;

            gap: 13px;
        }


        /* LOGIN - DEFAULT */

        .btn-login {

            color: #d6d4d1;

            font-size: 11px;

            padding: 8px 11px;

            transition: color .25s ease;
        }

        .btn-login:hover {

            color: #ffffff;
        }


        /* REQUEST ACCESS - DEFAULT */

        .btn-access {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 16px;

            border-radius: 50px;

            background: #71c4ef;

            color: #151515;

            font-size: 10px;

            font-weight: 700;

            transition:
                transform .25s ease,
                background .25s ease;
        }

        .btn-access:hover {

            transform: translateY(-1px);

            background: #86cff2;
        }


        /* =========================
           LOGGED-IN USER
        ========================= */

        .welcome-user {

            display: flex;

            align-items: center;

            gap: 5px;

            white-space: nowrap;
        }

        .welcome-text {

            color: #aaa8a5;

            font-size: 10px;

            font-weight: 500;
        }

        .employee-name {

            color: #ffffff;

            font-size: 11px;

            font-weight: 600;
        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-btn {

            border: 1px solid rgba(182, 204, 216, .55);

            background: transparent;

            color: #d6d4d1;

            padding: 8px 13px;

            border-radius: 50px;

            font-family: 'Inter', sans-serif;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;

            transition:
                color .25s ease,
                border-color .25s ease,
                background .25s ease,
                transform .25s ease;
        }

        .logout-btn:hover {

            color: #ffffff;

            border-color: #71c4ef;

            background: rgba(113,196,239,.08);

            transform: translateY(-1px);
        }


        /* =========================
           BACKGROUND NETWORK
        ========================= */

        .tech-network {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 1;

            overflow: hidden;

            opacity: .40;
        }

        .network-line {

            position: absolute;

            height: 1px;

            background: rgba(113,196,239,.13);

            transform-origin: left center;
        }

        .network-line.green {

            background: rgba(153,194,77,.11);
        }

        .network-line.line-a {

            width: 70vw;

            left: -12vw;

            top: 31%;

            transform: rotate(-3deg);
        }

        .network-line.line-b {

            width: 64vw;

            right: -12vw;

            top: 57%;

            transform: rotate(3deg);
        }

        .network-line.line-c {

            width: 72vw;

            left: -15vw;

            top: 81%;

            transform: rotate(-2deg);
        }


        /* =========================
           SIGNALS
        ========================= */

        .signal {

            position: absolute;

            width: 34px;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(113,196,239,.9),
                transparent
            );

            box-shadow: 0 0 7px rgba(113,196,239,.55);

            animation: dataSignal 8s linear infinite;
        }

        .signal.green {

            background: linear-gradient(
                90deg,
                transparent,
                rgba(153,194,77,.8),
                transparent
            );

            box-shadow: 0 0 7px rgba(153,194,77,.45);
        }

        .signal.s1 {

            top: 31%;

            left: -5%;
        }

        .signal.s2 {

            top: 57%;

            left: -10%;

            animation-delay: 3s;
        }

        .signal.s3 {

            top: 81%;

            left: -8%;

            animation-delay: 5.5s;
        }

        @keyframes dataSignal {

            0% {

                transform: translateX(0);

                opacity: 0;
            }

            8% {

                opacity: .75;
            }

            75% {

                opacity: .65;
            }

            100% {

                transform: translateX(120vw);

                opacity: 0;
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .analytics-container {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1000px;

            margin: 25px auto 70px;

            padding: 0 25px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .analytics-header {

            width: 100%;

            max-width: 820px;

            margin-bottom: 28px;

            text-align: center;
        }

        .analytics-kicker {

            color: #71c4ef;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 11px;
        }

        .analytics-header h1 {

            font-size: clamp(34px, 4vw, 48px);

            line-height: 1.05;

            letter-spacing: -2px;

            font-weight: 700;
        }


        /* =========================
           DASHBOARD CARD
        ========================= */

        .dashboard-card {

            width: 820px;

            max-width: 100%;

            background: #3b3c3d;

            border: 1px solid rgba(182,204,216,.7);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 20px 55px rgba(0,0,0,.35);
        }


        /* =========================
           DASHBOARD HEADER
        ========================= */

        .dashboard-header {

            height: 54px;

            padding: 0 21px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 1px solid rgba(182,204,216,.18);
        }

        .dashboard-title {

            font-size: 13px;

            font-weight: 600;

            color: #fffefb;
        }

        .dashboard-status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #99c24d;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1px;
        }

        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #99c24d;

            box-shadow: 0 0 8px rgba(153,194,77,.7);
        }


        /* =========================
           POWER BI
        ========================= */

        .powerbi-frame {

            width: 820px;

            max-width: 100%;

            height: 580px;

            background: #1d1c1c;

            overflow: hidden;
        }

        .powerbi-frame iframe {

            display: block;

            width: 100%;

            height: 100%;

            border: 0;
        }


        /* =========================
           FOOTER
        ========================= */

        .site-footer {

            position: relative;

            width: 100%;

            border-top: 1px solid rgba(182,204,216,.22);

            padding: 28px 5%;

            z-index: 5;

            margin-top: 45px;

            background: #1d1c1c;
        }

        .footer-inner {

            max-width: 1250px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .footer-brand {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #deddda;

            font-size: 11px;

            font-weight: 600;
        }

        .footer-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #71c4ef;

            box-shadow: 0 0 8px rgba(113,196,239,.6);
        }

        .footer-copy,
        .footer-year {

            color: #777573;

            font-size: 8px;

            letter-spacing: .3px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .nav-links {

                gap: 15px;
            }

            .dashboard-card {

                width: 760px;

                max-width: 100%;
            }

            .powerbi-frame {

                width: 760px;

                max-width: 100%;

                height: 550px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {

                padding-top: 95px;
            }

            .navbar-glass {

                width: 94%;

                padding: 11px 17px;
            }

            .nav-links {

                display: none;
            }

            .analytics-container {

                width: 100%;

                padding: 0 14px;

                margin-top: 20px;
            }

            .analytics-header {

                margin-bottom: 20px;
            }

            .analytics-header h1 {

                font-size: 30px;

                letter-spacing: -1.3px;
            }

            .dashboard-card {

                width: 100%;

                max-width: 100%;

                border-radius: 15px;
            }

            .dashboard-header {

                height: 48px;

                padding: 0 14px;
            }

            .dashboard-title {

                font-size: 11px;
            }

            .dashboard-status {

                font-size: 7px;
            }

            .powerbi-frame {

                width: 100%;

                height: 480px;
            }

            .site-footer {

                margin-top: 35px;
            }

            .footer-inner {

                flex-direction: column;

                gap: 10px;

                text-align: center;
            }

            .welcome-user {

                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BACKGROUND NETWORK
    ========================= -->

    <div class="tech-network">

        <div class="network-line line-c"></div>

        <div class="signal s1"></div>

    </div>


    <!-- =========================

    ========================= -->

    <header class="navbar-glass">

        <a href="index.html" class="nav-brand">

            <span class="logo-dot"></span>

        </a>


        <nav>

                <li>

                <li>
                    <a href="about.html">

                <li>

                </li>

                <li>

                <li>

        <!-- IMPORTANT:

            </a>

        </div>

    </header>


    <!-- =========================

    <main class="analytics-container">


        <!-- PAGE TITLE -->

            </div>

            <h1>

        </section>


        <!-- =========================

        ========================= -->

        <section class="dashboard-card">


            <div class="dashboard-header">

                </div>

                <iframe

    <!-- =========================

    ========================= -->

    <footer class="site-footer">

            </div>

    <!-- =========================================================
         FLOWCHAIN SESSION SYSTEM
         SAME LOGIC AS ADMIN DASHBOARD
    ========================================================= -->

    <script>

        /* =========================
           PAGE LOAD
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const storedUser =
                    localStorage.getItem(
                        "flowchainUser"
                    );


                /* =========================
                   NO LOGIN
                ========================= */

                if (!storedUser) {

                    window.location.href =
                        "login.html";

                    return;
                }


                let user;


                /* =========================
                   READ USER SESSION
                ========================= */

                try {

                    user =
                        JSON.parse(
                            storedUser
                        );

                } catch (error) {

                    clearFlowChainSession();

                    window.location.href =
                        "login.html";

                    return;
                }


                /* =========================
                   SHOW USER IN NAVBAR
                ========================= */

                const navActions =
                    document.getElementById(
                        "navActions"
                    );


                if (
                    navActions &&
                    user &&
                    user.name
                ) {

                    navActions.innerHTML = `

                        <div class="welcome-user">

                            <span class="welcome-text">
                                Welcome,
                            </span>

                            <span class="employee-name">
                                ${escapeHtml(user.name)}
                            </span>

                        </div>


                        <button
                            type="button"
                            class="logout-btn"
                            onclick="flowchainLogout()"
                        >
                            Logout
                        </button>

                    `;
                }

            }
        );


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================================
           CLEAR FLOWCHAIN SESSION
        ========================================================= */

        function clearFlowChainSession() {

            localStorage.removeItem(
                "flowchainUser"
            );

            localStorage.removeItem(
                "flowchainLoggedIn"
            );

            localStorage.removeItem(
                "flowchainUserName"
            );

            localStorage.removeItem(
                "flowchainAccountType"
            );

        }


        /* =========================================================
           LOGOUT
        ========================================================= */

        function flowchainLogout() {

            clearFlowChainSession();

            window.location.href =
                "login.html";

        }

    </script>


</body>

</html>
